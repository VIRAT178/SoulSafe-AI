<div style="font-family:Georgia,'Times New Roman',serif;background:linear-gradient(180deg,#fff1f2,#fff);padding:24px;color:#372828;">
  <div style="max-width:560px;margin:auto;background:#fff;border-radius:22px;overflow:hidden;border:1px solid #f5d0d0;box-shadow:0 18px 40px rgba(0,0,0,0.07);">
    <div style="padding:28px 24px;background:linear-gradient(135deg,#be123c,#f59e0b);color:#fff;text-align:center;">
      <div style="font-size:32px;line-height:1;margin-bottom:8px;">💍✨</div>
      <h2 style="margin:0;font-size:28px;">Happy Anniversary {{recipientName}}!</h2>
    </div>
    <div style="padding:28px 24px;font-size:16px;line-height:1.8;">
      <p style="margin-top:0;">{{message}}</p>
      <div style="margin:24px 0;padding:18px;border-radius:14px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-style:italic;text-align:center;">
        A little note wrapped in warmth and gratitude.
      </div>
      <p style="margin-bottom:0;color:#6b7280;">{{footer}}</p>
    </div>
  </div>
</div>
