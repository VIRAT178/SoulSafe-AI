<div style="font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#eff6ff,#fff);padding:24px;color:#1f2937;">
  <div style="max-width:560px;margin:auto;background:#ffffff;border-radius:20px;overflow:hidden;border:1px solid #bfdbfe;box-shadow:0 18px 40px rgba(0,0,0,0.08);">
    <div style="padding:28px 24px;background:linear-gradient(135deg,#2563eb,#14b8a6);color:#fff;text-align:center;">
      <div style="font-size:34px;line-height:1;margin-bottom:8px;">🎓🌟</div>
      <h2 style="margin:0;font-size:28px;">Congratulations {{recipientName}}!</h2>
    </div>
    <div style="padding:28px 24px;font-size:16px;line-height:1.7;">
      <p style="margin-top:0;">{{message}}</p>
      <div style="margin:24px 0;padding:16px;border-radius:14px;background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;font-weight:600;text-align:center;">
        Your next chapter starts now.
      </div>
      <p style="margin-bottom:0;color:#6b7280;">{{footer}}</p>
    </div>
  </div>
</div>
