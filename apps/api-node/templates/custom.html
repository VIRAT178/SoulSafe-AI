<div style="font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#f8fafc,#eef2ff);padding:24px;color:#111827;">
  <div style="max-width:560px;margin:auto;background:#ffffff;border-radius:20px;overflow:hidden;border:1px solid #c7d2fe;box-shadow:0 18px 40px rgba(0,0,0,0.08);">
    <div style="padding:28px 24px;background:linear-gradient(135deg,#4f46e5,#06b6d4);color:#fff;text-align:center;">
      <div style="font-size:32px;line-height:1;margin-bottom:8px;">💌</div>
      <h2 style="margin:0;font-size:26px;">A message for {{recipientName}}</h2>
    </div>
    <div style="padding:28px 24px;font-size:16px;line-height:1.8;">
      <p style="margin-top:0;">{{message}}</p>
      <div style="margin:24px 0;padding:16px;border-radius:14px;background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8;font-weight:600;text-align:center;">
        Sent with care by {{senderName}}
      </div>
      <p style="margin-bottom:0;color:#6b7280;">{{footer}}</p>
    </div>
  </div>
</div>
